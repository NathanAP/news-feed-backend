services:
    api:
        container_name: news-feed-api
        build: .
        ports:
            - "3000:3000"
        env_file:
            - .env
        environment:
            # Overrides the DATABASE_URL from .env. That one points at localhost, which is what the
            # API needs when it runs on the host (`task ls`); inside the compose network the database
            # answers to the service name instead. Keeping both means the same .env serves both ways
            # of running the API, which is the point: only the database is Docker-mandatory.
            DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
        depends_on:
            # The API runs migrations on boot, so it must not start before Postgres accepts
            # connections — otherwise the first boot races the database and dies.
            postgres:
                condition: service_healthy
        # Lets the container reach services running on the host (e.g. a native Ollama) via
        # `host.docker.internal`. Automatic on Docker Desktop; this makes it work on Linux too. In Docker
        # prefer KEYWORDS_MODE=groq|gemini; only set OLLAMA_BASE_URL=http://host.docker.internal:11434 if
        # you really want the host's local Ollama.
        extra_hosts:
            - "host.docker.internal:host-gateway"
        healthcheck:
            # /health is exempt from the maintenance guard, so it answers 200 whenever the app is up.
            # Use 127.0.0.1 (not localhost): the app binds IPv4 (0.0.0.0) and busybox may resolve localhost
            # to IPv6 (::1) first, which would be refused.
            test:
                [
                    "CMD-SHELL",
                    "wget -q -O /dev/null http://127.0.0.1:${API_PORT:-3000}/${API_VERSION:-v1}/health || exit 1",
                ]
            interval: 10s
            timeout: 3s
            retries: 5
            start_period: 10s
        restart: unless-stopped

    postgres:
        container_name: news-feed-postgres
        image: postgres:18-alpine
        ports:
            # Published so the API can also run on the host (`task ls`) and so any client (pgAdmin,
            # psql, a GUI) can reach it directly.
            - "5432:5432"
        environment:
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
            POSTGRES_DB: ${POSTGRES_DB}
        volumes:
            # Mounted at the parent rather than at PGDATA directly: the postgres:18 image places the
            # data under a version-scoped path, and mounting the parent persists it either way.
            - postgres_data:/var/lib/postgresql
        healthcheck:
            # pg_isready is the image's own readiness probe. It gates the API's depends_on above.
            test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
            interval: 5s
            timeout: 3s
            retries: 10
            start_period: 5s
        restart: unless-stopped

    # Database UI, development convenience — the stack's declared inspector (CLAUDE.md).
    pgadmin4:
        container_name: news-feed-pgadmin4
        image: dpage/pgadmin4
        ports:
            - "5050:80"
        environment:
            PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
            PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
            # Single-user desktop mode: no login screen for a local dev tool.
            PGADMIN_CONFIG_SERVER_MODE: "False"
            PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
        volumes:
            # servers.json pre-registers the connection so the server tree is already there on first
            # open. It holds no password on purpose — pgAdmin prompts for it.
            - ./pgadmin4/servers.json:/pgadmin4/servers.json:ro
            - pgadmin_data:/var/lib/pgadmin
        depends_on:
            postgres:
                condition: service_healthy
        restart: unless-stopped

volumes:
    postgres_data:
    pgadmin_data:
