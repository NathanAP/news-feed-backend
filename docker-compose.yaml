# Base stack: the API service, shared by every environment. The database is NOT here — it is composed
# in per environment, because production may use a managed database (AWS RDS) instead of a container,
# and Docker Compose can ADD or modify a service in an overlay but cannot REMOVE one that the base
# declares. Keeping the base as just the app is what makes "container Postgres in dev/staging, RDS in
# production" a config choice rather than a fight with the merge rules.
#
# How the overlays attach:
#   * dev      — docker-compose.override.yaml, merged AUTOMATICALLY by `docker compose up` (so `task ds`
#                needs no flags). Adds Postgres, pgAdmin, and `build: .`.
#   * staging  — docker-compose.staging.yaml, applied EXPLICITLY (`task staging-up`). Adds a container
#                Postgres.
#   * prod     — docker-compose.prod.yaml, applied EXPLICITLY (`task prod-up`). No Postgres container by
#                default (RDS); a commented block is there if you want a container instead.
# An explicit `-f` disables the automatic dev override, so staging/production never pick up pgAdmin or
# the local build.
services:
    api:
        container_name: news-feed-api
        # The image the API runs from. Dev builds it locally (the override adds `build: .`, which tags
        # the result as this default name); staging/production set API_IMAGE to a registry tag (e.g. an
        # ECR image built by CI) and never build on the host — they pull an immutable artifact.
        image: ${API_IMAGE:-news-feed-api:local}
        ports:
            # Bound to loopback on purpose: reachable from this host (and from a tunnel/reverse proxy
            # that runs ON this host, e.g. the ngrok dev tunnel or an nginx/ALB in front), never directly
            # from the LAN. In production the edge (reverse proxy / load balancer) terminates TLS and
            # forwards here; a prod overlay can rebind if its topology needs something else.
            - "127.0.0.1:${API_PORT:-3000}:${API_PORT:-3000}"
        # No env_file here on purpose: each overlay names its own (.env, .env.staging, .env.production),
        # so production never accidentally loads a dev .env — and a missing dev file cannot break a prod
        # boot. The base alone is a template, never run on its own.
        extra_hosts:
            # Lets the container reach services on the host (e.g. a native Ollama) via
            # `host.docker.internal`. Automatic on Docker Desktop; this makes it work on Linux too.
            - "host.docker.internal:host-gateway"
        healthcheck:
            # /health is exempt from the maintenance guard, so it answers 200 whenever the app is up.
            # Use 127.0.0.1 (not localhost): the app binds IPv4 (0.0.0.0) and busybox may resolve localhost
            # to IPv6 (::1) first, which would be refused.
            test:
                [
                    "CMD-SHELL",
                    "wget -q -O /dev/null http://127.0.0.1:${API_PORT:-3000}/${API_VERSION:-v1}/health || exit 1",
                ]
            interval: 10s
            timeout: 3s
            retries: 5
            start_period: 10s
        restart: unless-stopped
