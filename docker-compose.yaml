# Base stack: the services that run in EVERY environment — Postgres and the API. Postgres is not split
# into its own file; it is shared infrastructure, so it lives here alongside the API.
#
# Development-only conveniences (pgAdmin) live in docker-compose.override.yaml, which Docker Compose
# merges in AUTOMATICALLY on `docker compose up` — that is why `task ds`/`task dbs` need no extra flags.
# A future production file is applied EXPLICITLY (`-f docker-compose.yaml -f docker-compose.prod.yaml`),
# and an explicit `-f` disables the automatic override. So the dev-only pgAdmin never reaches production
# by simply never being part of this base — not by anyone remembering to remove it.
services:
    api:
        container_name: news-feed-api
        build: .
        ports:
            # Bound to loopback on purpose: reachable from this host (and from a tunnel/reverse proxy
            # that runs ON this host, e.g. the ngrok dev tunnel or nginx), never directly from the LAN.
            # A production file republishes this to whatever its edge requires.
            - "127.0.0.1:3000:3000"
        env_file:
            - .env
        environment:
            # Overrides the DATABASE_URL from .env. That one points at localhost, which is what the
            # API needs when it runs on the host (`task ls`); inside the compose network the database
            # answers to the service name instead. Keeping both means the same .env serves both ways
            # of running the API, which is the point: only the database is Docker-mandatory.
            DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
        depends_on:
            # The API runs migrations on boot, so it must not start before Postgres accepts
            # connections — otherwise the first boot races the database and dies.
            postgres:
                condition: service_healthy
        # Lets the container reach services running on the host (e.g. a native Ollama) via
        # `host.docker.internal`. Automatic on Docker Desktop; this makes it work on Linux too. In Docker
        # prefer KEYWORDS_MODE=groq|gemini; only set OLLAMA_BASE_URL=http://host.docker.internal:11434 if
        # you really want the host's local Ollama.
        extra_hosts:
            - "host.docker.internal:host-gateway"
        healthcheck:
            # /health is exempt from the maintenance guard, so it answers 200 whenever the app is up.
            # Use 127.0.0.1 (not localhost): the app binds IPv4 (0.0.0.0) and busybox may resolve localhost
            # to IPv6 (::1) first, which would be refused.
            test:
                [
                    "CMD-SHELL",
                    "wget -q -O /dev/null http://127.0.0.1:${API_PORT:-3000}/${API_VERSION:-v1}/health || exit 1",
                ]
            interval: 10s
            timeout: 3s
            retries: 5
            start_period: 10s
        restart: unless-stopped

    postgres:
        container_name: news-feed-postgres
        image: postgres:18-alpine
        ports:
            # Published so the API can also run on the host (`task ls`) and so a host client (pgAdmin,
            # psql, a GUI) can reach it directly — but bound to loopback, not exposed to the LAN.
            # The pgAdmin container does NOT use this published port; it reaches Postgres by service
            # name over the compose network.
            - "127.0.0.1:5432:5432"
        environment:
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
            POSTGRES_DB: ${POSTGRES_DB}
        volumes:
            # Mounted at the parent rather than at PGDATA directly: the postgres:18 image places the
            # data under a version-scoped path, and mounting the parent persists it either way.
            - postgres_data:/var/lib/postgresql
        healthcheck:
            # pg_isready is the image's own readiness probe. It gates the API's depends_on above.
            test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
            interval: 5s
            timeout: 3s
            retries: 10
            start_period: 5s
        restart: unless-stopped

volumes:
    postgres_data:
