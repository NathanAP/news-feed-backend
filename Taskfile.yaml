version: "3"

vars:
    BINARY: ./tmp/api{{exeExt}}
    PID_FILE: .pid
    LOG_FILE: ./tmp/app.log
    ERR_FILE: ./tmp/app.error.log

# Development-only seed commands live in cmd/seed/Taskfile.yaml. Flattened so they are called as
# `task sud`, `task sds`, ... from the root. They run the cmd/seed binary from the repo root.
# optional: the whole cmd/ folder is deleted by CI/CD in staging/production — without this, Task
# would fail to load the root Taskfile there. With it, the include is simply skipped when absent.
includes:
    seed:
        taskfile: ./cmd/seed/Taskfile.yaml
        dir: .
        flatten: true
        optional: true

tasks:
    default:
        desc: Show available tasks
        aliases: [help]
        cmds:
            - task --list
        silent: true

    # ── Setup ──────────────────────────────────────────────────────────────────

    setup:
        desc: Install dev tools, deps and pull the keywords SLM (needs Ollama installed)
        cmds:
            - go install github.com/sqlc-dev/sqlc/cmd/sqlc@latest
            - go install github.com/go-task/task/v3/cmd/task@latest
            - go mod download
            - task: ollama-pull

    ollama-pull:
        desc: Pull the keywords SLM model (requires Ollama - https://ollama.com/download)
        aliases: [op]
        cmds:
            - cmd: echo "Pulling the keywords SLM into Ollama (requires Ollama installed - https://ollama.com/download)"
            - ollama pull qwen3:4b

    # ── Build ──────────────────────────────────────────────────────────────────

    build:
        desc: Compile the application binary into ./tmp/
        aliases: [b]
        cmds:
            - cmd: powershell -Command "New-Item -ItemType Directory -Force tmp | Out-Null; go build -o {{.BINARY}} ."
              platforms: [windows]
            - cmd: mkdir -p tmp && go build -o {{.BINARY}} .
              platforms: [linux, darwin]

    # ── Local (no Docker) ──────────────────────────────────────────────────────

    local-start:
        desc: Build and start the application locally in background
        aliases: [ls]
        cmds:
            - task: build
            - cmd: powershell -Command "New-Item -ItemType Directory -Force tmp | Out-Null; (Start-Process -FilePath '{{.BINARY}}' -RedirectStandardOutput '{{.LOG_FILE}}' -RedirectStandardError '{{.ERR_FILE}}' -WindowStyle Hidden -PassThru).Id | Out-File -FilePath '{{.PID_FILE}}' -Encoding ascii"
              platforms: [windows]
            - cmd: mkdir -p tmp && nohup {{.BINARY}} > {{.LOG_FILE}} 2>&1 & echo $! > {{.PID_FILE}}
              platforms: [linux, darwin]

    local-down:
        desc: Stop the locally running application
        aliases: [ld]
        cmds:
            - cmd: powershell -Command "if (Test-Path '{{.PID_FILE}}') { Stop-Process -Id (Get-Content '{{.PID_FILE}}') -Force -ErrorAction SilentlyContinue; Remove-Item '{{.PID_FILE}}' }; Get-Process -Id (Get-NetTCPConnection -LocalPort 3000 -ErrorAction SilentlyContinue | Select-Object -ExpandProperty OwningProcess) -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue; Write-Host 'Done.'"
              platforms: [windows]
            - cmd: "[ -f {{.PID_FILE}} ] && kill $(cat {{.PID_FILE}}) && rm {{.PID_FILE}} || true; lsof -ti:3000 | xargs kill -9 2>/dev/null || true"
              platforms: [linux, darwin]

    local-logs:
        desc: Stream application logs including errors (tail -f equivalent)
        aliases: [ll]
        cmds:
            - cmd: powershell -Command "Get-Content '{{.LOG_FILE}}', '{{.ERR_FILE}}' -Wait"
              platforms: [windows]
            - cmd: tail -f {{.LOG_FILE}} {{.ERR_FILE}}
              platforms: [linux, darwin]

    local-restart:
        desc: Restart the locally running application
        aliases: [lr]
        cmds:
            - task: local-down
            - task: local-start

    # ── Docker ─────────────────────────────────────────────────────────────────

    docker-start:
        desc: Build and start the full stack via Docker Compose (API + Postgres + pgAdmin4)
        aliases: [ds]
        cmds:
            - docker compose up -d --build

    docker-down:
        desc: Stop Docker Compose services
        aliases: [dd]
        cmds:
            - docker compose down

    docker-restart:
        desc: Restart Docker Compose services (no rebuild)
        aliases: [dr]
        cmds:
            - docker compose restart

    docker-full-restart:
        desc: Stop everything, then rebuild and start again (down + up --build)
        aliases: [dfr]
        cmds:
            - task: docker-down
            - task: docker-start

    docker-prune:
        desc: Stop containers and prune unused Docker resources
        aliases: [dp]
        cmds:
            - docker compose down --volumes --remove-orphans
            - docker system prune -f

    # ── Staging / Production ───────────────────────────────────────────────────
    # Explicit `-f` overlays (base + the environment file). Passing `-f` disables the automatic dev
    # override, so these never pick up pgAdmin or the local build. They pull the image named by
    # API_IMAGE (set by CI/deploy) instead of building. Each needs its own env file present:
    # .env.staging / .env.production (gitignored; copy from the .example templates).

    staging-up:
        desc: Start the staging stack (base + staging overlay; container Postgres, no pgAdmin)
        cmds:
            - docker compose --env-file .env.staging -f docker-compose.yaml -f docker-compose.staging.yaml up -d

    staging-down:
        desc: Stop the staging stack (data volume is preserved)
        cmds:
            - docker compose --env-file .env.staging -f docker-compose.yaml -f docker-compose.staging.yaml down

    staging-logs:
        desc: Follow staging logs
        cmds:
            - docker compose --env-file .env.staging -f docker-compose.yaml -f docker-compose.staging.yaml logs -f

    prod-up:
        desc: Start the production stack (base + prod overlay; RDS by default, no Postgres container)
        cmds:
            - docker compose --env-file .env.production -f docker-compose.yaml -f docker-compose.production.yaml up -d

    prod-down:
        desc: Stop the production stack
        cmds:
            - docker compose --env-file .env.production -f docker-compose.yaml -f docker-compose.production.yaml down

    prod-logs:
        desc: Follow production logs
        cmds:
            - docker compose --env-file .env.production -f docker-compose.yaml -f docker-compose.production.yaml logs -f

    # ── Database ───────────────────────────────────────────────────────────────

    db-start:
        desc: Start only Postgres + pgAdmin4 (what `task ls` needs; UI at http://localhost:5050)
        aliases: [dbs]
        cmds:
            - docker compose up -d postgres pgadmin4

    db-down:
        desc: Stop Postgres + pgAdmin4
        aliases: [dbd]
        cmds:
            - docker compose stop postgres pgadmin4

    # ── Code quality ───────────────────────────────────────────────────────────

    sqlc-generate:
        desc: Run sqlc generate to produce type-safe DB code
        aliases: [sg]
        cmds:
            - sqlc generate

    vet-all:
        desc: Run go vet on all packages
        aliases: [va]
        cmds:
            - go vet ./...

    fmt:
        desc: Format all Go files with gofmt
        aliases: [f]
        cmds:
            - gofmt -w .

    # ── Tests ──────────────────────────────────────────────────────────────────

    test-units:
        desc: Run unit tests
        aliases: [tu]
        cmds:
            - go test ./tests/unit/... -v

    test-integration:
        desc: Run integration tests
        aliases: [ti]
        cmds:
            - go test ./tests/integration/... -v

    test-end-to-end:
        desc: Run end-to-end tests
        aliases: [te2e]
        cmds:
            - go test ./tests/end-to-end/... -v

    # ONE `go test` invocation on purpose — do not split this back into the three tasks above.
    #
    # The throwaway Postgres is shared by name across the packages of a run, and testcontainers' reaper
    # destroys it when the invocation that owns it exits (measured: gone in under 5s). Three chained
    # invocations therefore hand the next phase a container that is already sentenced: it attaches via
    # WithReuseByName, gets a valid DSN, starts running — and then the reaper fires and rips the
    # container away mid-phase. Every test still to run in that phase dies with
    # `failed to receive message: unexpected EOF`, which reads like a broken test and is not one.
    #
    # A single invocation means a single container lifecycle and no window to lose. It also matches
    # what CI does (`go test ./...`), so local and CI stop diverging — that divergence WAS the bug.
    #
    # The per-layer tasks above stay for focused runs (each is one invocation, so each is safe on its
    # own). Chaining them by hand — `task ti` immediately followed by `task te2e` — reopens the same
    # window; use `task ta` when you want everything.
    test-all:
        desc: Run all tests (unit + integration + end-to-end) in one invocation. Requires Docker running.
        aliases: [ta]
        cmds:
            - go test ./tests/... -v

    # The suite tears its own container down; this is for when a run is interrupted hard enough
    # that testcontainers' reaper does not get to it and the container is left orphaned.
    test-db-clean:
        desc: Remove an orphaned test Postgres container left by an interrupted run
        aliases: [tdc]
        cmds:
            - docker rm -f news-feed-test-postgres
