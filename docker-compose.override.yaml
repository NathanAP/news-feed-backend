# Development overlay. Docker Compose merges this on top of docker-compose.yaml AUTOMATICALLY on
# `docker compose up` (that is why `task ds`/`task dbs` take no extra flags). Everything here is either
# dev-only (pgAdmin) or the dev way of doing something the base leaves open (build the image locally,
# run Postgres in a container, load the dev .env).
#
# It never reaches staging/production: those apply their own file with an explicit `-f`, and an explicit
# `-f` disables this automatic override.
services:
    api:
        # Dev builds the image from source and tags it as the base's default name (news-feed-api:local).
        # Staging/production instead set API_IMAGE to a registry tag and never build.
        build: .
        env_file:
            - .env
        environment:
            # Override the .env DATABASE_URL (which points at localhost, for running the API on the host
            # with `task ls`) so the containerized API reaches Postgres by its service name over the
            # compose network. ${POSTGRES_*} are interpolated from the project .env.
            DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
        depends_on:
            # The API runs migrations on boot, so it must not start before Postgres is ready.
            postgres:
                condition: service_healthy

    postgres:
        container_name: news-feed-postgres
        image: postgres:18-alpine
        ports:
            # Published so the API can also run on the host (`task ls`) and so a host client (pgAdmin,
            # psql, a GUI) can reach it — but bound to loopback, not exposed to the LAN.
            - "127.0.0.1:5432:5432"
        environment:
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
            POSTGRES_DB: ${POSTGRES_DB}
        volumes:
            # Mounted at the parent rather than at PGDATA directly: the postgres:18 image places the
            # data under a version-scoped path, and mounting the parent persists it either way.
            - postgres_data:/var/lib/postgresql
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
            interval: 5s
            timeout: 3s
            retries: 10
            start_period: 5s
        restart: unless-stopped

    # Database UI, development convenience — the stack's declared inspector (CLAUDE.md). Must NOT run in
    # staging/production: it is in single-user desktop mode below with NO login screen.
    pgadmin4:
        container_name: news-feed-pgadmin4
        image: dpage/pgadmin4
        ports:
            # Loopback-bound: no login, so it must not be reachable from the LAN. A local SSH tunnel still
            # works (the tunnel runs on this host and reaches loopback) — the right kind for a tool with
            # no auth, unlike a public tunnel.
            - "127.0.0.1:5050:80"
        environment:
            PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
            PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
            # Single-user desktop mode: no login screen for a local dev tool. This is why pgAdmin opens
            # straight into the dashboard — and why it may not be exposed publicly.
            PGADMIN_CONFIG_SERVER_MODE: "False"
            PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
        volumes:
            - ./pgadmin4/servers.json:/pgadmin4/servers.json:ro
            - pgadmin_data:/var/lib/pgadmin
        depends_on:
            postgres:
                condition: service_healthy
        restart: unless-stopped

volumes:
    postgres_data:
    pgadmin_data:
