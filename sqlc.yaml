version: "2"
sql:
  # sql_package "database/sql" (rather than pgx/v5 native) keeps the generated code on *sql.DB and
  # sql.NullString/sql.NullTime, so controllers/transaction.go, the Querier interface and the test
  # mocks stay driver-agnostic. The driver underneath is still pgx, registered via pgx/v5/stdlib.
  # Switching to pgx native (pgtype.*) later is this one line plus a regen.
  - engine: "postgresql"
    queries: "./sqlc/queries/"
    schema: "./schema.sql"
    gen:
      go:
        package: "db"
        out: "./sqlc"
        emit_json_tags: true
        emit_interface: true
        # Every timestamptz becomes a utctime type instead of time.Time/sql.NullTime. pgx materializes
        # a scanned timestamptz in time.Local, so without this the API's date format would depend on
        # the host's timezone. See services/utctime for the full reasoning.
        overrides:
          - db_type: "timestamptz"
            go_type:
              import: "github.com/nathanap/news-feed-backend/services/utctime"
              package: "utctime"
              type: "Time"
          - db_type: "timestamptz"
            nullable: true
            go_type:
              import: "github.com/nathanap/news-feed-backend/services/utctime"
              package: "utctime"
              type: "NullTime"
